version: "3.9"

services:
  c2-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c2-platform
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Persist the SQLite database and workspace files outside the container
      - c2_data:/app/data
      - c2_workspaces:/app/backend/workspaces
      - c2_templates:/app/backend/templates
      - c2_inventories:/app/backend/inventories
    env_file:
      # All variables in .env are passed directly into the container
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Point the SQLite file at the persistent volume
      DB_PATH: /app/data/sqlite.db
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  c2_data:
  c2_workspaces:
  c2_templates:
  c2_inventories:
